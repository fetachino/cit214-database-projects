<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">CIT 214 database relationship map</title>
  <desc id="desc">A simplified visual map of entities used across the database coursework.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033} .box{fill:#eaf2ff;stroke:#3267a8;stroke-width:2;rx:10} .line{stroke:#526b85;stroke-width:2} .label{font-size:16px;font-weight:700} .small{font-size:13px}</style>
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="40" y="42" font-size="25" font-weight="700">Relational modeling patterns</text>
  <text x="40" y="68" font-size="14">Representative entities drawn from the apartment, library, tours, and property schemas.</text>
  <line class="line" x1="225" y1="165" x2="350" y2="165"/><line class="line" x1="550" y1="165" x2="675" y2="165"/>
  <line class="line" x1="450" y1="215" x2="450" y2="300"/><line class="line" x1="225" y1="350" x2="350" y2="350"/><line class="line" x1="550" y1="350" x2="675" y2="350"/>
  <rect class="box" x="55" y="125" width="170" height="80"/><text class="label" x="78" y="157">Publisher</text><text class="small" x="78" y="180">publisher_id · contact</text>
  <rect class="box" x="350" y="125" width="200" height="80"/><text class="label" x="389" y="157">Library / Property</text><text class="small" x="375" y="180">branch · building · unit</text>
  <rect class="box" x="675" y="125" width="170" height="80"/><text class="label" x="711" y="157">Book / Lease</text><text class="small" x="699" y="180">asset · relationship</text>
  <rect class="box" x="350" y="300" width="200" height="80"/><text class="label" x="404" y="332">Person</text><text class="small" x="377" y="355">borrower · owner · tenant</text>
  <rect class="box" x="55" y="310" width="170" height="80"/><text class="label" x="91" y="342">Adventure Trip</text><text class="small" x="78" y="365">season · distance · group</text>
  <rect class="box" x="675" y="310" width="170" height="80"/><text class="label" x="719" y="342">Queries</text><text class="small" x="700" y="365">joins · reports · filters</text>
</svg>
